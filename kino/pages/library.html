<!-- Library -->

<div class="content-wrapper">
    <div class="page-masthead split">
        <div>
            <p class="eyebrow">Library</p>
            <h1>Your Kino shelf</h1>
            <p>Creations, saves, and playlists — kept on the server, not just this browser.</p>
        </div>
        <a class="banner-link" href="#upload"><i class="fas fa-upload"></i> Upload new</a>
    </div>
    <div class="folder-grid">
        <div class="folder-card" data-lib="created">
            <h4><i class="fas fa-film"></i> Created</h4>
            <div class="folder-meta" data-count="created">0 titles</div>
        </div>
        <div class="folder-card" data-lib="saved">
            <h4><i class="fas fa-bookmark"></i> Saved</h4>
            <div class="folder-meta" data-count="saved">0 saved</div>
        </div>
        <div class="folder-card" data-lib="playlists">
            <h4><i class="fas fa-layer-group"></i> Playlists</h4>
            <div class="folder-meta" data-count="playlists">0 playlists</div>
        </div>
    </div>
    <div data-slot="body"></div>
</div>
