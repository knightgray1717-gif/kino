    <div class="series-modal" id="series-modal">
      <div class="modal-content">
        <div class="series-modal-header">
          <h3 class="zero-margin">Series Manager</h3>
          <button class="header-btn ghost" id="close-series-manager"><i class="fas fa-times"></i> Close</button>
        </div>
        <div class="series-grid">
          <div class="form-field">
            <label for="series-title-upload">Series title</label>
            <input id="series-title-upload" type="text" placeholder="e.g., Dream Weaver" />
          </div>
          <div class="form-field">
            <label for="series-season-upload">Season</label>
            <input id="series-season-upload" type="number" min="1" value="1" />
          </div>
          <div class="form-field">
            <label for="series-episode-upload">Episode</label>
            <input id="series-episode-upload" type="number" min="1" value="1" />
          </div>
        </div>
        <div class="series-grid">
          <div class="form-field">
            <label for="series-company-upload">Media company</label>
            <input id="series-company-upload" type="text" placeholder="e.g., Streamly Studios" />
          </div>
          <div class="form-field">
            <label for="series-director-upload">Director</label>
            <input id="series-director-upload" type="text" placeholder="e.g., A. Rivera" />
          </div>
          <div class="form-field">
            <label for="series-producer-upload">Producer</label>
            <input id="series-producer-upload" type="text" placeholder="e.g., L. Chen" />
          </div>
          <div class="form-field">
            <label for="series-dop-upload">Videography</label>
            <input id="series-dop-upload" type="text" placeholder="e.g., J. Malik" />
          </div>
        </div>
        <div class="form-field">
          <label for="series-featured-upload">Featured talent / partners</label>
          <input id="series-featured-upload" type="text" placeholder="e.g., Studio Partners" />
        </div>
        <div class="series-actions">
          <button class="header-btn signin-btn" id="save-series-upload"><i class="fas fa-save"></i> Save series info</button>
          <button class="header-btn ghost" id="reset-series-upload"><i class="fas fa-undo"></i> Reset</button>
        </div>
      </div>
    </div>
